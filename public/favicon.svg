<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tkc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="red-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tkc-grad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Medical Red & White Cross -->
  <rect x="52" y="32" width="24" height="64" rx="6" fill="#ffffff" />
  <rect x="32" y="52" width="64" height="24" rx="6" fill="#ffffff" />
  
  <rect x="56" y="36" width="16" height="56" rx="4" fill="url(#red-cross)" />
  <rect x="36" y="56" width="56" height="16" rx="4" fill="url(#red-cross)" />
  
  <!-- Pulse / ECG Line overlay in center -->
  <path d="M40 64 L54 64 L60 48 L68 80 L74 60 L80 64 L88 64" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
