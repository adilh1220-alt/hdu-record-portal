<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Offline - Record Management Portal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: background-color 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #090d16;
        color: #f8fafc;
      }
    }
    .container {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 28px;
      animation: gentle-pulse 3s infinite ease-in-out;
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #64748b;
      font-size: 15px;
      font-weight: 500;
    }
    @media (prefers-color-scheme: dark) {
      .offline-badge {
        color: #94a3b8;
      }
    }
    .offline-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .headline {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #94a3b8;
      }
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .secondary-btn {
      margin-top: 10px;
      background: transparent;
      color: #64748b;
      border: 1px solid #cbd5e1;
      box-shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      .secondary-btn {
        color: #cbd5e1;
        border-color: #334155;
      }
    }
    .status-pill {
      margin-top: 24px;
      padding: 6px 14px;
      background: rgba(100, 116, 139, 0.1);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #f59e0b;
      animation: blink 2s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Brand Logo -->
    <svg class="brand-logo" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="off-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="50%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="off-cross" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ef4444" />
          <stop offset="100%" stop-color="#dc2626" />
        </linearGradient>
      </defs>
      <rect x="10" y="10" width="172" height="172" rx="42" fill="url(#off-bg)" />
      <rect x="10" y="10" width="172" height="172" rx="42" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" />
      <g transform="translate(96, 96)">
        <rect x="-18" y="-54" width="36" height="108" rx="10" fill="#ffffff" />
        <rect x="-54" y="-18" width="108" height="36" rx="10" fill="#ffffff" />
        <rect x="-12" y="-48" width="24" height="96" rx="6" fill="url(#off-cross)" />
        <rect x="-48" y="-12" width="96" height="24" rx="6" fill="url(#off-cross)" />
        <path d="M-38 0 L-18 0 L-8 -22 L4 24 L14 -8 L22 0 L38 0" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </svg>

    <!-- Offline Indicator (matching user screenshot) -->
    <div class="offline-badge">
      <svg class="offline-icon" viewBox="0 0 24 24">
        <!-- Cloud Slash / No Connection SVG -->
        <path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0-4 7h1.05a5 5 0 0 0 9.64 1.8" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
      <span>You're offline</span>
    </div>

    <h1 class="headline">Record Management Portal</h1>
    <p class="subtitle">
      No internet connection detected. You can continue working in offline mode — all active patient census and endoscopy drafts will sync automatically when you reconnect.
    </p>

    <!-- Action Buttons -->
    <button class="action-btn" onclick="checkAndReload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
      </svg>
      <span>Retry Connection</span>
    </button>

    <a href="/?source=pwa&offline=1" class="action-btn secondary-btn">
      <span>Open Offline App Shell</span>
    </a>

    <div class="status-pill">
      <span class="dot"></span>
      <span id="network-note">Offline Mode Active (Local Storage Protected)</span>
    </div>
  </div>

  <script>
    function checkAndReload() {
      if (navigator.onLine) {
        window.location.href = '/?source=pwa';
      } else {
        var note = document.getElementById('network-note');
        if (note) {
          note.innerText = 'Still offline. Please check Wi-Fi or mobile data.';
          setTimeout(function() {
            note.innerText = 'Offline Mode Active (Local Storage Protected)';
          }, 3000);
        }
      }
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', function() {
      window.location.href = '/?source=pwa';
    });
  </script>
</body>
</html>
